# 02-windows-endpoint / inputs.conf
# Deploy to: C:\Program Files\SplunkUniversalForwarder\etc\system\local\inputs.conf
# (the 02-install-uf.ps1 script also installs Sysmon; copy this file in place,
#  then run `& "C:\Program Files\SplunkUniversalForwarder\bin\splunk.exe" restart`)
#
# Forwards the high-value Windows event logs to the soc_capstone index:
#   - Sysmon Operational  (process/network/file/registry — the hunting backbone)
#   - Security            (logon success/failure 4624/4625, account creation 4720,
#                          group changes, etc. — required for password-attempt & account-creation detections)
#   - System              (service installs, driver loads)
#   - Application         (app-level crashes / installs)
[WinEventLog://Microsoft-Windows-Sysmon/Operational]
disabled = false
index = soc_capstone
sourcetype = XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
renderXml = true

[WinEventLog://Security]
disabled = false
index = soc_capstone
sourcetype = WinEventLog:Security
renderXml = false
evt_dc_name =
evt_dns_name =

[WinEventLog://System]
disabled = false
index = soc_capstone
sourcetype = WinEventLog:System
renderXml = false

[WinEventLog://Application]
disabled = false
index = soc_capstone
sourcetype = WinEventLog:Application
renderXml = false
